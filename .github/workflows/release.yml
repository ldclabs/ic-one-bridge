name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  verify:
    uses: ./.github/workflows/test.yml
  test:
    needs: verify
    runs-on: ubuntu-24.04
    container: rust:1.97.1-bookworm@sha256:0e2bcaef56d041a486784e54104a81aebe0da44bd03019bd70bc0401e42e4a97
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build canisters
        run: |
          mkdir -p out
          rustup show active-toolchain
          # ic-wasm dropped its bundled wasm-opt in 0.11, so the optimize
          # subcommand no longer exists; both tools are pinned so a release
          # rebuilt later produces the same bytes.
          cargo install ic-wasm --version 0.11.1 --locked
          BINARYEN_VERSION="version_131"
          BINARYEN_ARCHIVE="binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz"
          BINARYEN_DIR="$(mktemp -d)"
          curl --fail --location --retry 3 \
            --output "$BINARYEN_DIR/$BINARYEN_ARCHIVE" \
            "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/$BINARYEN_ARCHIVE"
          echo "b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db  $BINARYEN_DIR/$BINARYEN_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$BINARYEN_DIR/$BINARYEN_ARCHIVE" -C "$BINARYEN_DIR"
          WASM_OPT="$BINARYEN_DIR/binaryen-$BINARYEN_VERSION/bin/wasm-opt"
          ic-wasm --version
          "$WASM_OPT" --version
          # No RUSTFLAGS here on purpose: the getrandom backend for wasm comes
          # from .cargo/config.toml, and an env RUSTFLAGS would override it.
          cargo build --target wasm32-unknown-unknown --release --locked -p one_bridge_canister
          for CAN in one_bridge_canister
          do
            cp "target/wasm32-unknown-unknown/release/$CAN.wasm" out/
            cp "src/$CAN/$CAN.did" "out/$CAN.did"
            WASM="out/$CAN.wasm"
            ic-wasm $WASM -o $WASM metadata candid:service -f "out/$CAN.did" -v public
            ic-wasm $WASM -o $WASM shrink
            # rustc emits these proposals by default, so wasm-opt has to be told
            # to accept them or it refuses to parse the module.
            "$WASM_OPT" \
              -O3 \
              --enable-mutable-globals \
              --enable-nontrapping-float-to-int \
              --enable-simd \
              --enable-bulk-memory \
              --enable-sign-ext \
              --enable-reference-types \
              --enable-memory64 \
              --enable-multivalue \
              --enable-tail-call \
              --inline-functions-with-loops \
              "$WASM" -o "$WASM.optimized"
            mv "$WASM.optimized" "$WASM"
            gzip -n $WASM
            SHA256="$(sha256sum < "out/$CAN.wasm.gz" | sed 's/ .*$//g')"
            echo $SHA256 > "out/$CAN.wasm.gz.$SHA256.txt"
          done
          ls -lah out
      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*
